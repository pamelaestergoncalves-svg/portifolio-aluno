<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #d8ffd8, #f5fff5);
        }

        nav {
            background: #1f6b3d;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
            font-size: 18px;
            font-weight: bold;
        }

        nav a:hover {
            color: #c5f7b7;
        }

        h1 {
            text-align: center;
            color: #1f6b3d;
            margin-top: 30px;
        }

        .formulario {
            width: 400px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        label {
            font-weight: bold;
            color: #1f6b3d;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-sizing: border-box;
        }

        textarea {
            height: 120px;
            resize: none;
        }

        button {
            width: 100%;
            background: #1f6b3d;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #2e8b57;
        }

        .info {
            text-align: center;
            margin-top: 30px;
            color: #333;
        }
    </style>

</head>

<body>

    <nav>
        <a href="página.html">Início</a>
        <a href="animais.html">Animais</a>
        <a href="cuidados.html">Cuidados</a>
        <a href="contato.html">Contato</a>
    </nav>

    <h1>📞 Entre em Contato</h1>

    <div class="formulario">

        <form>

            <label>Nome:</label>
            <input type="text" placeholder="Digite seu nome">

            <label>E-mail:</label>
            <input type="email" placeholder="Digite seu e-mail">

            <label>Mensagem:</label>
            <textarea placeholder="Digite sua mensagem"></textarea>

            <button type="submit">Enviar Mensagem</button>

        </form>

    </div>

    <div class="info">
        <h3>🐄 Saúde e Qualidade de Vida Animal</h3>
        <p>Email: contato@saudeanimal.com</p>
        <p>Telefone: (44) 99137-3500</p>
    </div>

</body>

</html>
